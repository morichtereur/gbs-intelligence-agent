name: Update demo page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build demo (no API key needed)
        run: python demo.py

      - name: Assert output
        run: |
          test -s output/DEMO/intelligence_explorer.html
          grep -q "Where competitors publish" output/DEMO/intelligence_explorer.html

      - name: Publish into docs/
        run: cp output/DEMO/intelligence_explorer.html docs/index.html

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/index.html; then
            echo "No changes — page already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Rebuild demo page"
          git push
